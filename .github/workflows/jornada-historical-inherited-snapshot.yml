name: Temporary inherited-news source snapshot

on:
  push:
    branches:
      - jornada-herdadas-revalidacao-historico-20260917
    paths:
      - .github/workflows/jornada-historical-inherited-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source without running application code
        run: git archive --format=tar.gz --output=jornada-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: jornada-inherited-news-source
          retention-days: 1
          path: jornada-source.tar.gz
