name: Temporary Mesa source menu geometry validation

on:
  push:
    branches:
      - jornada-mesa-menu-tema-largura-intrinseca-20260917
    paths:
      - .github/workflows/jornada-mesa-menu-tema-largura-intrinseca.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-mesa-menu-tema-largura-intrinseca-20260917
          fetch-depth: 0
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = '503fe6cf0dc691c25bfff12754dbfe20e2d0b857'
          test "$(git hash-object app/admin/editorial/redacao-automatica/mesa/mesa.module.css)" = '4f28c385cc0e08e6e2c89d8cda920b9a2442660c'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install disposable test tools
        run: |
          npm ci --ignore-scripts
          python3 -m venv /tmp/mesa-layout-venv
          /tmp/mesa-layout-venv/bin/pip install playwright==1.57.0
          /tmp/mesa-layout-venv/bin/python -m playwright install --with-deps chromium firefox
      - name: Reproduce current clipping with no network
        run: |
          mkdir -p /tmp/mesa-geometry-evidence
          set +e
          unshare -Urn /tmp/mesa-layout-venv/bin/python .ci/mesa-source-layout/check.py --browsers chromium --regression-only --output /tmp/mesa-geometry-evidence/before
          BASELINE_STATUS=$?
          set -e
          test "$BASELINE_STATUS" = 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/mesa-geometry-evidence/before/report.json').read_text())
          assert report['failed'] == 1 and not report['external_requests'], report
          assert any('horizontal clipping' in case.get('error', '') for case in report['cases']), report
          PY
      - name: Apply minimal intrinsic width correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/admin/editorial/redacao-automatica/mesa/mesa.module.css')
          text = path.read_text()
          replacements = [
              ('.sourceBody {\n  grid-column: 3;\n  min-width: 0;\n  display: grid;', '.sourceBody {\n  grid-column: 3;\n  min-width: 0;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n  container: mesa-source / inline-size;'),
              ('.sourceTools {\n  position: relative;', '.sourceTools {\n  position: relative;\n  min-width: 0;'),
              ('.classificationEditor {\n  position: absolute;', '.classificationEditor {\n  position: absolute;\n  max-width: 100%;'),
              ('.classificationEditor select {\n  max-width: 106px;', '.classificationEditor select {\n  min-width: 0;\n  max-width: 106px;'),
              ('.classificationEditor button {\n  font-weight: 780;', '.classificationEditor button {\n  flex-shrink: 0;\n  font-weight: 780;'),
              ('.sourceThemeMenu {\n  position: relative;', '.sourceThemeMenu {\n  position: relative;\n  min-width: 0;\n  max-width: 100%;'),
              ('.sourceThemeMenu small { margin-left: 5px; }', '.sourceThemeMenu small { margin-left: 5px; }\n\n/* Em cartões estreitos, reserva a linha da classificação antes de abrir o Tema. */\n@container mesa-source (max-width: 16rem) {\n  .sourceTools {\n    padding-top: calc(1.2rem + 8px);\n  }\n}'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Chromium and Firefox geometry without network
        run: |
          unshare -Urn /tmp/mesa-layout-venv/bin/python .ci/mesa-source-layout/check.py --browsers chromium firefox --output /tmp/mesa-geometry-evidence/after
      - name: Existing regression tests without network
        run: |
          unshare -Urn node_modules/.bin/tsx --test \
            lib/redacao-automatica/newsroom-mesa-cleanup-theme-ux.test.ts \
            lib/redacao-automatica/newsroom-operational-desk.test.ts \
            lib/redacao-automatica/newsroom-mesa-organization.test.ts \
            lib/redacao-automatica/newsroom-theme-continuity.test.ts \
            lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts \
            | tee /tmp/mesa-geometry-evidence/regression.log
      - name: Production build without network or database credentials
        run: unshare -Urn npm run build 2>&1 | tee /tmp/mesa-geometry-evidence/build.log
      - name: Commit only validated files
        run: |
          git restore next-env.d.ts
          rm .github/workflows/jornada-mesa-menu-tema-largura-intrinseca.yml
          git add app/admin/editorial/redacao-automatica/mesa/mesa.module.css .github/workflows/jornada-mesa-menu-tema-largura-intrinseca.yml
          git fetch origin main
          test "$(git rev-parse origin/main)" = '503fe6cf0dc691c25bfff12754dbfe20e2d0b857'
          ACTUAL="$(git diff --cached --name-only origin/main | sort)"
          EXPECTED="$(printf '%s\n' '.ci/mesa-source-layout/check.py' 'app/admin/editorial/redacao-automatica/mesa/mesa.module.css' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: contain Mesa theme menu and classification controls'
          git push origin HEAD:jornada-mesa-menu-tema-largura-intrinseca-20260917
          git rev-parse HEAD > /tmp/mesa-geometry-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-source-geometry-evidence
          path: /tmp/mesa-geometry-evidence
          retention-days: 3
