name: Stage verified Mesa selection files
on:
  push:
    branches: [jornada-mesa-producao-intencoes-continuidade-v2-20260917]
    paths: [.github/workflows/mesa-intents-selection-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify patch and store source blobs; never update branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = silvamplam/Jornada-pt-final
          test "$GITHUB_REF" = refs/heads/jornada-mesa-producao-intencoes-continuidade-v2-20260917
          mkdir -p /tmp/mesa-selection-stage
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess
          from pathlib import Path
          root=Path.cwd(); out=Path('/tmp/mesa-selection-stage'); repo=os.environ['GITHUB_REPOSITORY']
          def command(*args,input=None):
              return subprocess.check_output(args,input=input)
          def api(path,body=None):
              args=['gh','api',f'repos/{repo}/{path}']
              if body is not None: args+=['--method','POST','--input','-']
              return json.loads(command(*args,input=None if body is None else json.dumps(body).encode()))
          expected={
            '.ci/mesa-intents-sql/application-entry.ts':'c29842a68ca6308a7b0ee491d7d9a5a2840719a1',
            '.ci/mesa-intents-sql/application.mjs':'c6fb6d05822f06d613fd3fb291d59c1946db8602',
            '.ci/mesa-intents-ui/browser.py':'e943a17696e95476113927ba7cafa06cd13f8bc7',
            '.ci/mesa-intents-ui/client.tsx':'ccea088d25a5fdcc54fdf5144392578ee8bae8bb',
            '.ci/mesa-intents-ui/driver.mjs':'0c7e930a5b72e1b7475fa738f3e7de28d61ea1f7',
            'app/admin/editorial/redacao-automatica/mesa/_mesa-intent-preparation-client.tsx':'548e47481d52e4a01fea06bb337a5d6226d22020',
            'app/admin/editorial/redacao-automatica/mesa/_mesa-selection-client.tsx':'230b39c80d7e72771ba9dbc592304a248ff1a01d',
            'app/admin/editorial/redacao-automatica/mesa/_mesa-selection-state.ts':'45a5397171a629c76235419e2e601d8f58367f45',
            'app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/_theme-continuity-client.tsx':'33c45dbf2b615f2fbfd5b06f497d4e8792ddcb6e',
            'app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/page.tsx':'bd89d1f13e626c7a9bc7d17a6368201e69ca0796',
            'app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts':'a3e381193f996782e220280f04b06b615f63c5ff',
            'docs/mesa-production-intents-ui-v1.md':'680c2c31521363aec6661ef47e45a93e81d0a9ae',
            'lib/redacao-automatica/newsroom-mesa-production-intents-http.ts':'761a77ca966ee8fd8c27c8edbf9a683474cdcff4',
            'lib/redacao-automatica/newsroom-mesa-production-intents-ui.test.ts':'6133d9decfff97628176a1fff9735a2be0e7c69b',
            'lib/redacao-automatica/newsroom-mesa-production-intents-ui.ts':'fb6899fc9c50fb10922781dd4a6f4d69a09e1f38',
            'lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts':'b389562f92e91b4cbb89236dcde876b177c8c2a8',
          }
          assert not command('git','status','--porcelain').strip()
          parent=command('git','rev-parse','HEAD').decode().strip()
          base_tree=command('git','rev-parse','HEAD^{tree}').decode().strip()
          stored=api('git/blobs/3773271fa2a4ad9cfb5ae4a25822af8f19f9fcf1')
          patch=lzma.decompress(base64.b64decode(base64.b64decode(stored['content'])))
          assert len(patch)==86103
          assert hashlib.sha256(patch).hexdigest()=='b07fb0969cd4c7d7c2425ebcfe3dafaa3da8fee12b1ecfa5515d6958f7a7146e'
          (out/'selection.patch').write_bytes(patch)
          paths={p.decode() for p in re.findall(rb'^diff --git a/(.*?) b/.*$',patch,re.M)}
          assert paths==set(expected)
          assert all(not p.startswith('.github/') for p in paths)
          command('git','apply','--check','--index','-',input=patch)
          command('git','apply','--index','-',input=patch)
          assert set(command('git','diff','HEAD','--name-only').decode().splitlines())==paths
          for name,sha in expected.items():
              assert command('git','hash-object',name).decode().strip()==sha,name
          result={'parent':parent,'baseTree':base_tree,'files':expected,'branchesUpdated':False}
          (out/'verified-files.json').write_text(json.dumps(result,indent=2))
          tree=command('git','write-tree').decode().strip()
          command('git','archive','--format=tar.gz','-o',str(out/'staged-source.tar.gz'),tree)
          for name,sha in expected.items():
              saved=api('git/blobs',{'content':Path(name).read_text(),'encoding':'utf-8'})
              assert saved['sha']==sha,name
              print('STORED',sha,name,flush=True)
          (out/'stored-files.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-selection-staged-files
          path: /tmp/mesa-selection-stage
          retention-days: 7
