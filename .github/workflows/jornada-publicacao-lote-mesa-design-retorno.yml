name: Temporary batch publication Mesa continuity

on:
  push:
    branches:
      - jornada-publicacao-lote-mesa-design-retorno-20260917
    paths:
      - .github/workflows/jornada-publicacao-lote-mesa-design-retorno.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-publicacao-lote-mesa-design-retorno-20260917
          fetch-depth: 0
      - name: Apply scoped implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/admin/editorial/redacao-automatica/publicacao-lote/page.tsx')
          text = page.read_text()
          old = '''          <nav aria-label="Navegação da publicação em lote">\n            <a href="/admin/editorial/redacao-automatica">Redação Automática</a>\n            <a href="/admin/editorial/artigos">Artigos</a>\n            <a href="/admin">Backoffice</a>\n          </nav>\n'''
          new = '''          <nav aria-label="Navegação da publicação em lote">\n            <a href="/admin/editorial/redacao-automatica/mesa">Mesa da Redação</a>\n            <a href="/admin/editorial/artigos">Artigos</a>\n            <a href="/admin">Backoffice</a>\n          </nav>\n'''
          assert old in text
          page.write_text(text.replace(old, new, 1))

          client = Path('app/admin/editorial/redacao-automatica/publicacao-lote/_batchPreflightClient.tsx')
          text = client.read_text()
          anchor = 'const BATCH_PUBLICATION_ROUTE = "/api/admin/editorial/redacao-automatica/publicacao-lote";\n'
          assert anchor in text and 'const MESA_ROUTE' not in text
          text = text.replace(anchor, anchor + 'const MESA_ROUTE = "/admin/editorial/redacao-automatica/mesa";\n', 1)
          anchor = '''  function clearTransferredBatch() {\n    window.sessionStorage.removeItem(\n      EDITORIAL_BATCH_TRANSFER_STORAGE_KEY,\n    );\n    window.sessionStorage.removeItem(\n      EDITORIAL_BATCH_TRANSFER_SOURCE_PACKAGE_STORAGE_KEY,\n    );\n  }\n'''
          assert anchor in text
          text = text.replace(anchor, anchor + '''\n  function returnToMesaAfterSuccessfulPublication() {\n    window.location.assign(MESA_ROUTE);\n  }\n''', 1)
          old = '''    setBatchFinalized(true);\n    setPublicationError(null);\n    clearTransferredBatch();\n  }\n\n  async function finalizeBatchEditorialFlow() {\n'''
          new = '''    setBatchFinalized(true);\n    setPublicationError(null);\n    clearTransferredBatch();\n    returnToMesaAfterSuccessfulPublication();\n  }\n\n  async function finalizeBatchEditorialFlow() {\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''      await finalizeBatchEditorialFlow();\n      setBatchFinalized(true);\n      setPublicationError(null);\n      clearTransferredBatch();\n    } catch (error) {\n'''
          new = '''      await finalizeBatchEditorialFlow();\n      setBatchFinalized(true);\n      setPublicationError(null);\n      clearTransferredBatch();\n      returnToMesaAfterSuccessfulPublication();\n    } catch (error) {\n'''
          assert old in text
          client.write_text(text.replace(old, new, 1))

          css = Path('app/admin/editorial/redacao-automatica/publicacao-lote/publicacao-lote.module.css')
          text = css.read_text()
          marker = '/* Continuidade visual com a Mesa da Redação. */'
          assert marker not in text
          text += '''\n\n/* Continuidade visual com a Mesa da Redação. */\n.shell {\n  padding: 18px;\n  background: #edf2ed;\n  color: #182a1d;\n}\n.container { max-width: 1280px; }\n.hero {\n  padding: 20px 22px;\n  border: 1px solid #274c34;\n  border-radius: 8px;\n  background: #173d27;\n  box-shadow: 0 8px 24px rgb(22 53 31 / 14%);\n}\n.hero h1 {\n  color: #f7fbf7;\n  font-family: Georgia, "Times New Roman", serif;\n  font-size: clamp(1.75rem, 3.5vw, 2.35rem);\n  font-weight: 720;\n  letter-spacing: -0.015em;\n}\n.hero .eyebrow { color: #9fd2ad; }\n.description { color: #d6e3d8; }\n.hero nav a {\n  border-color: rgb(224 239 226 / 34%);\n  border-radius: 5px;\n  color: #f7fbf7;\n  background: rgb(255 255 255 / 4%);\n}\n.hero nav a:hover, .hero nav a:focus-visible {\n  border-color: #cfe3d3;\n  background: rgb(255 255 255 / 9%);\n}\n.workspace { gap: 12px; margin-top: 12px; }\n.panel, .results {\n  padding: 17px 18px;\n  border-color: #c7d5c9;\n  border-radius: 8px;\n  background: #fbfdfb;\n  box-shadow: 0 7px 18px rgb(26 55 33 / 7%);\n}\n.sectionEyebrow { color: #2f7b4b; }\n.sectionHeader h2, .resultsHeader h2 {\n  color: #173d27;\n  font-family: Georgia, "Times New Roman", serif;\n  font-weight: 720;\n}\n.contextGrid label > span, .textareaField > span, .analysisNote, .automaticAnalysisNote,\n.imageInstructions, .preparedSummary p, .existingUrl { color: #5d6c62; }\n.contextGrid select, .textareaField textarea, .textareaField input {\n  border-color: #b8c8bb;\n  border-radius: 6px;\n  color: #213529;\n  background: #fff;\n}\n.contextGrid select:disabled { background: #f0f4f0; color: #7a887f; }\n.contextGrid select:focus-visible, .textareaField textarea:focus-visible,\n.textareaField input:focus-visible, .analysisActions button:focus-visible,\n.confirmationAction button:focus-visible,\n.imagePickerRow:has(.fileInput:focus-visible) .imagePicker {\n  outline: 3px solid rgb(38 130 74 / 20%);\n  outline-offset: 2px;\n}\n.originalTextDetails { border-top-color: #d7e0d8; }\n.originalTextDetails summary { color: #365642; }\n.preparedSummary { border-color: #afd0b7; border-radius: 7px; background: #f1f8f2; }\n.preparedSummary strong { color: #173d27; }\n.analysisActions button, .confirmationAction button, .imagePicker {\n  border-color: #1f7843;\n  border-radius: 6px;\n  background: #1f7843;\n}\n.analysisActions button:hover, .confirmationAction button:hover, .imagePicker:hover { background: #185f35; }\n.analysisActions .retryAction { border-color: #aebfb1; color: #31513c; background: #fff; }\n.analysisActions .retryAction:hover { border-color: #7f9d87; background: #f3f8f4; }\n.articleResults > h3, .imageFileProblems h3 { color: #294b35; }\n.articleHeading h4 {\n  color: #173d27;\n  font-family: Georgia, "Times New Roman", serif;\n  font-weight: 690;\n}\n.articleResults > ol > li { border-color: #d3ddd4; background: #fff; }\n.articleKey { background: #173d27; }\n.validArticle, .associatedImage { border-color: #abd1b5 !important; }\n.associatedImage { background: #f0f8f2 !important; }\n.contextComplete, .readyBadge, .publicationStatusSuccess {\n  border-color: #9acaaa;\n  background: #eef8f1;\n  color: #176438;\n}\n.neutralBadge, .limitNote, .publicationStatusNeutral {\n  border-color: #cdd8cf;\n  background: #f5f8f5;\n  color: #56665b;\n}\n@media (max-width: 720px) {\n  .shell { padding: 8px; }\n  .hero { padding: 16px; }\n}\n'''
          css.write_text(text)

          test = Path('lib/redacao-automatica/editorial-batch-mesa-return-design.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst page = readFileSync("app/admin/editorial/redacao-automatica/publicacao-lote/page.tsx", "utf8");\nconst client = readFileSync("app/admin/editorial/redacao-automatica/publicacao-lote/_batchPreflightClient.tsx", "utf8");\nconst css = readFileSync("app/admin/editorial/redacao-automatica/publicacao-lote/publicacao-lote.module.css", "utf8");\n\ntest("publicação em lote aponta visual e operacionalmente para a Mesa", () => {\n  assert.match(page, /href="\\/admin\\/editorial\\/redacao-automatica\\/mesa">Mesa da Redação/);\n  assert.match(client, /const MESA_ROUTE = "\\/admin\\/editorial\\/redacao-automatica\\/mesa"/);\n  assert.match(client, /window\\.location\\.assign\\(MESA_ROUTE\\)/);\n});\n\ntest("regresso à Mesa acontece apenas nos dois percursos de sucesso integral", () => {\n  assert.equal((client.match(/returnToMesaAfterSuccessfulPublication\\(\\);/g) ?? []).length, 2);\n});\n\ntest("página reutiliza a gramática visual verde e editorial da Mesa", () => {\n  assert.match(css, /Continuidade visual com a Mesa da Redação/);\n  assert.match(css, /\\.hero[\\s\\S]*background: #173d27/);\n  assert.match(css, /\\.articleHeading h4[\\s\\S]*font-family: Georgia/);\n  assert.match(css, /\\.analysisActions button,[\\s\\S]*background: #1f7843/);\n});\n''')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run relevant regression tests
        run: |
          npx tsx --test \
            lib/redacao-automatica/editorial-batch-mesa-return-design.test.ts \
            lib/redacao-automatica/editorial-batch-publication-client.test.ts \
            lib/redacao-automatica/newsroom-theme-continuity.test.ts
      - name: Production build without database credentials
        shell: bash
        run: |
          unset SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
          npm run build
      - name: Commit tested implementation
        shell: bash
        run: |
          git restore next-env.d.ts 2>/dev/null || true
          rm -f .github/workflows/jornada-publicacao-lote-mesa-design-retorno.yml
          git add -A
          git fetch origin main
          ACTUAL="$(git diff --cached --name-only origin/main | sort)"
          EXPECTED="$(printf '%s\n' \
            'app/admin/editorial/redacao-automatica/publicacao-lote/_batchPreflightClient.tsx' \
            'app/admin/editorial/redacao-automatica/publicacao-lote/page.tsx' \
            'app/admin/editorial/redacao-automatica/publicacao-lote/publicacao-lote.module.css' \
            'lib/redacao-automatica/editorial-batch-mesa-return-design.test.ts' | sort)"
          printf 'NET DIFF:\n%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: align batch publication with newsroom Mesa"
          git push origin HEAD:jornada-publicacao-lote-mesa-design-retorno-20260917
