name: Temporary theme continuity bypass fix

on:
  push:
    branches:
      - jornada-tema-continuity-bypass-fix-20260917
    paths:
      - .github/workflows/jornada-theme-continuity-bypass-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-tema-continuity-bypass-fix-20260917
          fetch-depth: 0
      - name: Apply scoped fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts')
          text = route.read_text()
          old = 'import { isMesaUuid, mesaOrganizationCommand } from "@/lib/redacao-automatica/newsroom-mesa-organization";\n'
          new = old + 'import { readThemeContinuity } from "@/lib/redacao-automatica/newsroom-theme-continuity";\n'
          assert old in text and 'readThemeContinuity' not in text
          text = text.replace(old, new, 1)

          anchor = '''function errorStatus(code: string): number {\n  if (code === "input_invalid") return 400;\n  if (code === "preparation_conflict") return 409;\n  if (code === "service_unavailable") return 503;\n  return 502;\n}\n'''
          helper = anchor + '''\ntype GenericThemeContinuityRequirement =\n  | Readonly<{ status: "clear" }>\n  | Readonly<{ status: "required"; themeTitle: string }>\n  | Readonly<{ status: "unavailable" }>;\n\nasync function genericThemeContinuityRequirement(\n  themeIds: readonly string[],\n): Promise<GenericThemeContinuityRequirement> {\n  try {\n    for (const themeId of [...new Set(themeIds)]) {\n      const continuity = await readThemeContinuity(themeId);\n      if (!continuity) return { status: "unavailable" };\n      if (continuity.publishedArticleCount > 0) {\n        return { status: "required", themeTitle: continuity.theme.title };\n      }\n    }\n    return { status: "clear" };\n  } catch {\n    return { status: "unavailable" };\n  }\n}\n\nfunction themeContinuityRequiredResponse(themeTitle: string) {\n  return NextResponse.json({\n    ok: false,\n    code: "theme_continuity_required",\n    message: `O Tema «${themeTitle}» já tem artigos publicados. Usa «Voltar a levar à Produção» em Continuidade editorial para rever os artigos existentes antes de criar novos.`,\n  }, { status: 409 });\n}\n\nfunction themeContinuityUnavailableResponse() {\n  return NextResponse.json({\n    ok: false,\n    code: "theme_continuity_unavailable",\n    message: "Não foi possível confirmar a continuidade editorial deste Tema. Nenhuma Produção genérica foi criada.",\n  }, { status: 503 });\n}\n'''
          assert anchor in text and 'genericThemeContinuityRequirement' not in text
          text = text.replace(anchor, helper, 1)

          old = '''  if (rawPayload?.mesaVersion === 3) {\n    const contextInput = contextPreparationInput(payload);\n    return contextInput\n      ? prepareMesaContexts(contextInput)\n      : NextResponse.json({ ok: false, code: "input_invalid", message: "A seleção de contextos não é válida." }, { status: 400 });\n  }\n'''
          new = '''  if (rawPayload?.mesaVersion === 3) {\n    const contextInput = contextPreparationInput(payload);\n    if (!contextInput) {\n      return NextResponse.json({ ok: false, code: "input_invalid", message: "A seleção de contextos não é válida." }, { status: 400 });\n    }\n    const themeIds = contextInput.contexts\n      .filter((context) => textValue(context.kind) === "theme")\n      .map((context) => textValue(context.themeId));\n    const continuityRequirement = await genericThemeContinuityRequirement(themeIds);\n    if (continuityRequirement.status === "unavailable") return themeContinuityUnavailableResponse();\n    if (continuityRequirement.status === "required") {\n      return themeContinuityRequiredResponse(continuityRequirement.themeTitle);\n    }\n    return prepareMesaContexts(contextInput);\n  }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          anchor = '''  const input = prepareInput(payload);\n  if (!input) {\n    return NextResponse.json({\n      ok: false,\n      code: "input_invalid",\n      message: "O pedido de preparação não é válido.",\n    }, { status: 400 });\n  }\n\n'''
          replacement = anchor + '''  if (input.themeId) {\n    const continuityRequirement = await genericThemeContinuityRequirement([input.themeId]);\n    if (continuityRequirement.status === "unavailable") return themeContinuityUnavailableResponse();\n    if (continuityRequirement.status === "required") {\n      return themeContinuityRequiredResponse(continuityRequirement.themeTitle);\n    }\n  }\n\n'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)
          route.write_text(text)

          page = Path('app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/page.tsx')
          text = page.read_text()
          old = '          <MesaSelectionTray />\n'
          new = '''          {context.articleCount > 0 ? (\n            <p className={styles.selectionMessage} role="status">\n              Este Tema já tem artigos publicados. Para voltar à Produção, usa «Voltar a levar à Produção» em Continuidade editorial acima; os artigos existentes serão revistos antes de qualquer artigo novo.\n            </p>\n          ) : <MesaSelectionTray />}\n'''
          assert old in text
          text = text.replace(old, new, 1)
          page.write_text(text)

          test = Path('lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst route = readFileSync(\n  "app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts",\n  "utf8",\n);\nconst themePage = readFileSync(\n  "app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/page.tsx",\n  "utf8",\n);\n\ntest("Tema publicado bloqueia a preparação genérica no servidor", () => {\n  assert.match(route, /readThemeContinuity/);\n  assert.match(route, /continuity\\.publishedArticleCount > 0/);\n  assert.match(route, /code: "theme_continuity_required"/);\n  assert.match(route, /genericThemeContinuityRequirement\\(themeIds\\)/);\n  assert.match(route, /genericThemeContinuityRequirement\\(\\[input\\.themeId\\]\\)/);\n  assert.match(route, /Nenhuma Produção genérica foi criada/);\n});\n\ntest("Tema publicado deixa de expor o PREPARAR PRODUÇÃO genérico na página do Tema", () => {\n  assert.match(themePage, /context\\.articleCount > 0/);\n  assert.match(themePage, /Voltar a levar à Produção/);\n  assert.match(themePage, /artigos existentes serão revistos/);\n  assert.match(themePage, /: <MesaSelectionTray \\/>/);\n});\n''')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run focused regression tests
        run: |
          npx tsx --test \
            lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts \
            lib/redacao-automatica/newsroom-theme-continuity.test.ts \
            lib/redacao-automatica/newsroom-mesa-contexts-production-2c-runtime.test.ts \
            lib/redacao-automatica/newsroom-mesa-organization.test.ts
      - name: Production build without database or network
        shell: bash
        run: |
          unset SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
          unshare -Urn npm run build
      - name: Verify final scope
        shell: bash
        run: |
          git restore next-env.d.ts 2>/dev/null || true
          rm -f .github/workflows/jornada-theme-continuity-bypass-fix.yml
          git status --short
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            'app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/page.tsx' \
            'app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts' \
            'lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts' | sort)"
      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/editorial/redacao-automatica/mesa/temas/'[themeId]'/page.tsx \
            app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts \
            lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts \
            .github/workflows/jornada-theme-continuity-bypass-fix.yml
          git commit -m "fix: enforce theme continuity after publication"
          git push origin HEAD:jornada-tema-continuity-bypass-fix-20260917
