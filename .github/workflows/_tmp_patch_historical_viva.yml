name: Temporary historical Viva patch

on:
  push:
    branches:
      - jornada-composicao-remover-grupo-importar-viva-20261013

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-composicao-remover-grupo-importar-viva-20261013
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/_tmp_patch_historical_viva.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'Importar zonas da Viva' 'app/admin/editorial/composicao/[matchdayId]/HierarchicalCompositionDeskClient.tsx'
          grep -q 'Remover grupo' 'app/admin/editorial/composicao/[matchdayId]/HierarchicalCompositionDeskClient.tsx'
          grep -q 'import_historical_viva_zones_v32' 'app/api/admin/editorial/composicao/route.ts'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/admin/editorial/composicao/[matchdayId]/HierarchicalCompositionDeskClient.tsx' 'app/api/admin/editorial/composicao/route.ts'
          git commit -m 'Corrigir remoção de grupos e importar zonas da Viva'
          git push origin HEAD:jornada-composicao-remover-grupo-importar-viva-20261013
