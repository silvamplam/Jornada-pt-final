name: Stage verified Mesa release patch
on:
  push:
    branches: [jornada-mesa-producao-intencoes-continuidade-v2-20260917]
    paths: [.github/workflows/mesa-intents-release-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify preserved patch and store blobs without updating branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = silvamplam/Jornada-pt-final
          test "$GITHUB_REF" = refs/heads/jornada-mesa-producao-intencoes-continuidade-v2-20260917
          mkdir -p /tmp/mesa-release-stage
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess
          from pathlib import Path
          out=Path('/tmp/mesa-release-stage');repo=os.environ['GITHUB_REPOSITORY']
          def command(*args,input=None): return subprocess.check_output(args,input=input)
          def api(path,body=None):
              args=['gh','api',f'repos/{repo}/{path}']
              if body is not None: args+=['--method','POST','--input','-']
              return json.loads(command(*args,input=None if body is None else json.dumps(body).encode()))
          expected={
            '.github/workflows/mesa-intents-application.yml':'b65413698b16ead7fa8d6d50d3817f0361899af6',
            '.ci/mesa-intents-sql/publication.py':'b91eed59e7aab11362dbab563926660b64c9aa91',
            '.ci/mesa-intents-sql/latest-boundary.mjs':'0d9eb312b39e4603fa197acfc2659ceb73532baa',
            '.ci/mesa-intents-sql/application-entry.ts':'5b746956c0e59c9ed0414488146b49025a055b49',
            '.ci/mesa-intents-sql/latest_bootstrap.py':'3d24f617c37040f8770f55e51353d5ac22c9a7f3',
            '.ci/mesa-intents-sql/application.mjs':'a28d9e475cb42a74f2605efe1f220570dfa9a334',
            'app/api/admin/editorial/redacao-automatica/publicacao-lote/route.ts':'69747df8801b7781493cfb12003afef451b894b3',
            'lib/redacao-automatica/newsroom-mesa-admin-entry.test.ts':'195a82925f1c523ab915e77ac8628b67f2d23090',
            'lib/redacao-automatica/newsroom-mesa-latest-placement.test.ts':'912b3497073e6aa4a451806b29d4f0b5b3091726',
            'lib/redacao-automatica/newsroom-theme-continuity.test.ts':'c50af945185077ec0dd371f7cd8289846e2fcb0c',
            'lib/redacao-automatica/newsroom-mesa-production-intents-service-internal.ts':'7e999cd327bf6f6badf81aeac41995e59898f3f0',
            'supabase/migrations/20260917213000_newsroom_mesa_intent_publication_v1.sql':'f5a4485586ab38202ff290a945ffcf8cf96d8c9e',
            'docs/mesa-production-intents-release-boundaries-v1.md':'25ccf5d3a4686378d26f4badf7b05d8a8935eda0',
          }
          assert not command('git','status','--porcelain').strip()
          parent=command('git','rev-parse','HEAD').decode().strip()
          tree=command('git','rev-parse','HEAD^{tree}').decode().strip()
          parts=[]
          for sha in ['c1cf895fb0535bf6c636b982e2b6682185fb2dce','f0b143ea53a31589942b600bffe2c24bb4b12c6a','90088bebd2ca2de4e0ee9c4d83b38a4eba596f17','dfc696e55833367a28f34a2a1a2ed363a3021bf3']:
              stored=api('git/blobs/'+sha)
              b=base64.b64decode(stored['content'])
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              parts.append(b)
          patch=lzma.decompress(base64.b64decode(b''.join(parts)))
          assert len(patch)==64422
          assert hashlib.sha256(patch).hexdigest()=='b4983c93fd1e36e82365456da02be1fbb049699bd3dc0f18f2ec4a9bd3d7c505'
          paths={p.decode() for p in re.findall(rb'^diff --git a/(.*?) b/.*$',patch,re.M)}
          assert paths==set(expected)
          (out/'verified.patch').write_bytes(patch)
          command('git','apply','--check','--index','-',input=patch)
          command('git','apply','--index','-',input=patch)
          assert set(command('git','diff','HEAD','--name-only').decode().splitlines())==paths
          for name,sha in expected.items():
              assert command('git','hash-object',name).decode().strip()==sha,name
          result={'parent':parent,'baseTree':tree,'files':expected,'sourceLocalCommit':'3dcaee6ec954c16502cf7f53506f45693b32e56a','branchesUpdated':False}
          (out/'verified-files.json').write_text(json.dumps(result,indent=2))
          for name,sha in expected.items():
              saved=api('git/blobs',{'content':Path(name).read_text(),'encoding':'utf-8'})
              assert saved['sha']==sha,name
              print('STORED',sha,name,flush=True)
          (out/'stored-files.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-release-staged-files
          path: /tmp/mesa-release-stage
          retention-days: 7
