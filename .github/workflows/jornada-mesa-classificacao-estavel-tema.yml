name: Temporary Mesa stable classification control

on:
  push:
    branches:
      - jornada-mesa-classificacao-estavel-tema-20260917
    paths:
      - .github/workflows/jornada-mesa-classificacao-estavel-tema.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-mesa-classificacao-estavel-tema-20260917
          fetch-depth: 0
      - name: Apply minimal layout correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('app/admin/editorial/redacao-automatica/mesa/mesa.module.css')
          text = css.read_text()

          old = '''.sourceTools {\n  min-height: 18px;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n}\n'''
          new = '''.sourceTools {\n  position: relative;\n  min-height: 18px;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''.classificationEditor {\n  position: absolute;\n  right: 4px;\n  bottom: 4px;\n  z-index: 1;\n'''
          new = '''.classificationEditor {\n  position: absolute;\n  top: 0;\n  right: 0;\n  bottom: auto;\n  z-index: 1;\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''.sourceTools:has(.sourceThemeMenu[open]) .classificationEditor {\n  position: static;\n  margin-left: auto;\n  opacity: 1;\n  transform: none;\n}\n'''
          new = '''.sourceTools:has(.sourceThemeMenu[open]) .classificationEditor {\n  opacity: 1;\n  transform: none;\n}\n'''
          assert old in text
          text = text.replace(old, new, 1)
          css.write_text(text)

          test = Path('lib/redacao-automatica/newsroom-mesa-cleanup-theme-ux.test.ts')
          text = test.read_text()
          old = '''test("abrir o menu Tema retira o editor de classificação da posição absoluta", () => {\n  assert.match(css, /sourceTools:has\\(\\.sourceThemeMenu\\[open\\]\\) \\.classificationEditor[\\s\\S]*position: static/);\n  assert.match(css, /sourceBody:has\\(\\.sourceThemeMenu\\[open\\]\\)[\\s\\S]*padding-bottom: 6px/);\n});\n'''
          new = '''test("abrir o menu Tema mantém o editor de classificação ancorado no mesmo sítio", () => {\n  assert.match(css, /\\.sourceTools \\{[\\s\\S]*position: relative/);\n  assert.match(css, /\\.classificationEditor \\{[\\s\\S]*position: absolute;[\\s\\S]*top: 0;[\\s\\S]*right: 0;[\\s\\S]*bottom: auto/);\n  assert.doesNotMatch(css, /sourceTools:has\\(\\.sourceThemeMenu\\[open\\]\\) \\.classificationEditor[\\s\\S]{0,120}position: static/);\n});\n'''
          assert old in text
          test.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run focused regression tests
        run: |
          npx tsx --test \
            lib/redacao-automatica/newsroom-mesa-cleanup-theme-ux.test.ts \
            lib/redacao-automatica/newsroom-operational-desk.test.ts
      - name: Production build without database credentials
        shell: bash
        run: |
          unset SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
          npm run build
      - name: Commit tested implementation
        shell: bash
        run: |
          git restore next-env.d.ts 2>/dev/null || true
          rm -f .github/workflows/jornada-mesa-classificacao-estavel-tema.yml
          git add -A
          git fetch origin main
          ACTUAL="$(git diff --cached --name-only origin/main | sort)"
          EXPECTED="$(printf '%s\n' \
            'app/admin/editorial/redacao-automatica/mesa/mesa.module.css' \
            'lib/redacao-automatica/newsroom-mesa-cleanup-theme-ux.test.ts' | sort)"
          printf 'NET DIFF:\n%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep Mesa classification control stable"
          git push origin HEAD:jornada-mesa-classificacao-estavel-tema-20260917
