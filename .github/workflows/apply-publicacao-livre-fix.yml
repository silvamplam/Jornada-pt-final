name: Apply publicacao livre fix

on:
  push:
    branches:
      - jornada-composicao-publicacao-livre-20261016

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-composicao-publicacao-livre-20261016
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply publication freedom fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('app/admin/editorial/composicao/[matchdayId]/page.tsx')
          s = admin.read_text()
          s = s.replace('import { editorialVisualFamilyCapacity } from "@/lib/editorial-visual-families";\n', '')
          s = s.replace('''  const historicalDynamicOpeningKeys = [\n    "dominant_main",\n    "other_chronicle_1",\n    "other_chronicle_2",\n    "other_chronicle_3",\n  ] as const;\n''', '''  const historicalDynamicOpeningKeys = [\n    "dominant_main",\n  ] as const;\n''')
          s = s.replace('''        const capacity =\n          editorialVisualFamilyCapacity(\n            zone.visualFamily,\n          );\n\n''', '')
          s = s.replace('''        const complete =\n          zone.sortOrder === zoneIndex + 1\n          && editorialVisualFamilyPublicationPositionsAreValid(zone.visualFamily, items.map((item) => item.position))\n''', '''        const complete =\n          zone.sortOrder === zoneIndex + 1\n          && items.length > 0\n          && editorialVisualFamilyPublicationPositionsAreValid(zone.visualFamily, items.map((item) => item.position))\n''')
          s = s.replace('''              `${zone.publicTitle.trim() || `Zona editorial ${zoneIndex + 1}`} — incompleta: são obrigatórios ordem e ${capacity} notícias válidas.`,\n''', '''              `${zone.publicTitle.trim() || `Zona editorial ${zoneIndex + 1}`} — incompleta: mantém pelo menos uma notícia válida, sem posições duplicadas ou fora do layout.`,\n''')
          admin.write_text(s)

          api = Path('app/api/admin/editorial/composicao/route.ts')
          s = api.read_text()
          s = s.replace('''const HISTORICAL_DYNAMIC_PUBLICATION_CAPACITY = {\n  six_news: 6,\n  six_news_1_2_3: 6,\n  five_news_balanced: 5,\n  five_news_secondary: 5,\n  five_news_column: 5,\n} as const;\n\n''', '')
          s = s.replace('''const HISTORICAL_DYNAMIC_OPENING_KEYS = [\n  "dominant_main",\n  "other_chronicle_1",\n  "other_chronicle_2",\n  "other_chronicle_3",\n] as const;\n''', '''const HISTORICAL_DYNAMIC_OPENING_KEYS = [\n  "dominant_main",\n] as const;\n''')
          s = s.replace('''      `Completa os 4 lugares da Abertura antes de publicar. Em falta: ${missingOpening.map(\n        hierarchicalSlotLabel,\n      ).join(", ")}.`,\n''', '''      `Completa a manchete da Abertura antes de publicar. Em falta: ${missingOpening.map(\n        hierarchicalSlotLabel,\n      ).join(", ")}.`,\n''')
          s = s.replace('''    const capacity =\n      HISTORICAL_DYNAMIC_PUBLICATION_CAPACITY[\n        zone.visual_family\n      ];\n\n''', '')
          s = s.replace('''    const validItems =\n      editorialVisualFamilyPublicationPositionsAreValid(zone.visual_family, zoneItems.map((item) => item.position))\n''', '''    const validItems =\n      zoneItems.length > 0\n      && editorialVisualFamilyPublicationPositionsAreValid(zone.visual_family, zoneItems.map((item) => item.position))\n''')
          s = s.replace('''        `Completa a zona editorial ${zoneIndex + 1} antes de publicar: ${capacity} notícias válidas são obrigatórias.`,\n''', '''        `Revê a zona editorial ${zoneIndex + 1}: mantém pelo menos uma notícia válida, sem posições duplicadas ou fora do layout.`,\n''')
          api.write_text(s)

          families = Path('lib/editorial-visual-families.ts')
          s = families.read_text().replace('    allowsPartialPublication: false,\n', '    allowsPartialPublication: true,\n', 1)
          families.write_text(s)
          PY

      - name: Validate focused behavior
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx tsx --test lib/editorial-visual-families.test.ts
          git diff --check
          grep -q 'const HISTORICAL_DYNAMIC_OPENING_KEYS = \[' app/api/admin/editorial/composicao/route.ts
          grep -q 'zoneItems.length > 0' app/api/admin/editorial/composicao/route.ts
          grep -q 'items.length > 0' 'app/admin/editorial/composicao/[matchdayId]/page.tsx'

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'app/admin/editorial/composicao/[matchdayId]/page.tsx' app/api/admin/editorial/composicao/route.ts lib/editorial-visual-families.ts
          git commit -m "Fix: libertar publicação da composição dinâmica"
          git push origin HEAD:jornada-composicao-publicacao-livre-20261016
