name: Temporary PostgreSQL tools for offline intents
on:
  push:
    branches: [jornada-mesa-producao-intencoes-continuidade-v2-20260917]
    paths: [.github/workflows/jornada-intents-postgres-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Export test engine without application or database connections
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17.6-bookworm
          mkdir -p /tmp/pgtools
          docker image inspect postgres:17.6-bookworm --format '{{json .RepoDigests}}' > /tmp/pgtools/image-digest.txt
          CID=$(docker create postgres:17.6-bookworm)
          trap 'docker rm "$CID" >/dev/null' EXIT
          docker cp "$CID:/usr/lib/postgresql" /tmp/pgtools/postgresql
          docker cp "$CID:/usr/share/postgresql" /tmp/pgtools/share-postgresql
          docker cp "$CID:/usr/lib/x86_64-linux-gnu" /tmp/pgtools/lib
          tar -czf /tmp/postgres17-offline-tools.tar.gz -C /tmp/pgtools .
      - uses: actions/upload-artifact@v4
        with:
          name: postgres17-offline-tools
          retention-days: 1
          path: /tmp/postgres17-offline-tools.tar.gz
