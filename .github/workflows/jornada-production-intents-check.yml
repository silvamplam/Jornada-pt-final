name: Temporary production intent checked source
on:
  push:
    branches: [jornada-mesa-producao-intencoes-continuidade-v2-20260917]
    paths: [.github/workflows/jornada-production-intents-check.yml]
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-mesa-producao-intencoes-continuidade-v2-20260917
          fetch-depth: 0
      - name: Restore exact locally tested source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = '6367ed98d6062dfaf5516904e214a4b6acbd03be'
          mkdir -p /tmp/intents-foundation-evidence
          python3 - <<'PY'
          import base64, hashlib, json, re, tarfile, zlib
          from pathlib import Path
          workflow = Path('.github/workflows/jornada-production-intents-foundation.yml').read_text()
          payload = re.search(r"payload = '([^']+)'", workflow).group(1)
          Path('/tmp/intents-foundation-evidence/transfer.txt').write_text(payload)
          # Restore one character omitted in transmission; the original SHA-256 is mandatory.
          assert payload.count('JPsiNN3uaWJ+E9F') == 1
          payload = payload.replace('JPsiNN3uaWJ+E9F', 'JPsiNN3uaWwJ+E9F', 1)
          raw = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '62a9f77b8e40e7248ecc2dd73ed97dbf0584d8c7a13beadb56c8896c8531b809'
          files = json.loads(raw)
          allowed = {
            'lib/redacao-automatica/newsroom-mesa-production-intents.ts',
            'lib/redacao-automatica/newsroom-mesa-production-intents.test.ts',
            'docs/mesa-production-intents-v1.md',
          }
          assert set(files) == allowed
          for name, text in files.items():
            path = Path(name)
            assert not path.exists(), name
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(text.encode('utf-8'))
          with tarfile.open('/tmp/intents-foundation-evidence/validated-source.tar.gz', 'w:gz') as archive:
            for name in sorted(allowed): archive.add(name)
          print('Source SHA-256 verified; no application route has been run.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies without application scripts
        run: npm ci --ignore-scripts --include=dev
      - name: Prepare offline command wrapper
        shell: bash
        run: |
          test -z "$(find . -maxdepth 1 -name '.env*' -print)"
          cat > /tmp/intents-offline <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec sudo unshare --net -- bash -c '
            ip link set lo up
            saved_path="$1"
            shift
            exec runuser -u runner -- env PATH="$saved_path" NEXT_TELEMETRY_DISABLED=1 SUPABASE_URL= SUPABASE_SERVICE_ROLE_KEY= NEXT_PUBLIC_SUPABASE_URL= NEXT_PUBLIC_SUPABASE_ANON_KEY= "$@"
          ' isolated "$PATH" "$@"
          SH
          chmod +x /tmp/intents-offline
      - name: Behavior and compatibility tests offline
        shell: bash
        run: |
          /tmp/intents-offline node node_modules/tsx/dist/cli.mjs --test \
            lib/redacao-automatica/newsroom-mesa-production-intents.test.ts \
            lib/redacao-automatica/newsroom-theme-continuity.test.ts \
            lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts \
            lib/redacao-automatica/newsroom-mesa-contexts-production-2c-runtime.test.ts \
            lib/redacao-automatica/newsroom-mesa-organization.test.ts \
            lib/redacao-automatica/editorial-batch-parser.test.ts \
            lib/redacao-automatica/editorial-batch-transfer.test.ts \
            | tee /tmp/intents-foundation-evidence/tests.log
      - name: Type check and production build offline
        shell: bash
        run: |
          /tmp/intents-offline node node_modules/typescript/bin/tsc --noEmit --pretty false 2>&1 | tee /tmp/intents-foundation-evidence/typecheck.log
          /tmp/intents-offline npm run build 2>&1 | tee /tmp/intents-foundation-evidence/build.log
      - name: Commit validated foundation only
        shell: bash
        run: |
          git restore next-env.d.ts
          rm .github/workflows/jornada-production-intents-snapshot.yml .github/workflows/jornada-production-intents-foundation.yml .github/workflows/jornada-production-intents-check.yml
          git add lib/redacao-automatica/newsroom-mesa-production-intents.ts lib/redacao-automatica/newsroom-mesa-production-intents.test.ts docs/mesa-production-intents-v1.md .github/workflows/jornada-production-intents-snapshot.yml .github/workflows/jornada-production-intents-foundation.yml .github/workflows/jornada-production-intents-check.yml
          git fetch origin main
          test "$(git rev-parse origin/main)" = '6367ed98d6062dfaf5516904e214a4b6acbd03be'
          ACTUAL="$(git diff --cached --name-only origin/main | sort)"
          EXPECTED="$(printf '%s\n' docs/mesa-production-intents-v1.md lib/redacao-automatica/newsroom-mesa-production-intents.test.ts lib/redacao-automatica/newsroom-mesa-production-intents.ts | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: define per-context production intent rules'
          git push origin HEAD:jornada-mesa-producao-intencoes-continuidade-v2-20260917
          git rev-parse HEAD > /tmp/intents-foundation-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intents-foundation-evidence
          path: /tmp/intents-foundation-evidence
          retention-days: 3
