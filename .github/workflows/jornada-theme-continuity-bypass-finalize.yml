name: Temporary finalize theme continuity bypass fix

on:
  push:
    branches:
      - jornada-tema-continuity-bypass-fix-20260917
    paths:
      - .github/workflows/jornada-theme-continuity-bypass-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-tema-continuity-bypass-fix-20260917
          fetch-depth: 0
      - name: Apply already validated patch and commit clean net diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts')
          text = route.read_text()
          old = 'import { isMesaUuid, mesaOrganizationCommand } from "@/lib/redacao-automatica/newsroom-mesa-organization";\n'
          text = text.replace(old, old + 'import { readThemeContinuity } from "@/lib/redacao-automatica/newsroom-theme-continuity";\n', 1)
          anchor = '''function errorStatus(code: string): number {\n  if (code === "input_invalid") return 400;\n  if (code === "preparation_conflict") return 409;\n  if (code === "service_unavailable") return 503;\n  return 502;\n}\n'''
          helper = anchor + '''\ntype GenericThemeContinuityRequirement =\n  | Readonly<{ status: "clear" }>\n  | Readonly<{ status: "required"; themeTitle: string }>\n  | Readonly<{ status: "unavailable" }>;\n\nasync function genericThemeContinuityRequirement(\n  themeIds: readonly string[],\n): Promise<GenericThemeContinuityRequirement> {\n  try {\n    for (const themeId of [...new Set(themeIds)]) {\n      const continuity = await readThemeContinuity(themeId);\n      if (!continuity) return { status: "unavailable" };\n      if (continuity.publishedArticleCount > 0) {\n        return { status: "required", themeTitle: continuity.theme.title };\n      }\n    }\n    return { status: "clear" };\n  } catch {\n    return { status: "unavailable" };\n  }\n}\n\nfunction themeContinuityRequiredResponse(themeTitle: string) {\n  return NextResponse.json({\n    ok: false,\n    code: "theme_continuity_required",\n    message: `O Tema «${themeTitle}» já tem artigos publicados. Usa «Voltar a levar à Produção» em Continuidade editorial para rever os artigos existentes antes de criar novos.`,\n  }, { status: 409 });\n}\n\nfunction themeContinuityUnavailableResponse() {\n  return NextResponse.json({\n    ok: false,\n    code: "theme_continuity_unavailable",\n    message: "Não foi possível confirmar a continuidade editorial deste Tema. Nenhuma Produção genérica foi criada.",\n  }, { status: 503 });\n}\n'''
          assert anchor in text and 'genericThemeContinuityRequirement' not in text
          text = text.replace(anchor, helper, 1)
          old3 = '''  if (rawPayload?.mesaVersion === 3) {\n    const contextInput = contextPreparationInput(payload);\n    return contextInput\n      ? prepareMesaContexts(contextInput)\n      : NextResponse.json({ ok: false, code: "input_invalid", message: "A seleção de contextos não é válida." }, { status: 400 });\n  }\n'''
          new3 = '''  if (rawPayload?.mesaVersion === 3) {\n    const contextInput = contextPreparationInput(payload);\n    if (!contextInput) {\n      return NextResponse.json({ ok: false, code: "input_invalid", message: "A seleção de contextos não é válida." }, { status: 400 });\n    }\n    const themeIds = contextInput.contexts\n      .filter((context) => textValue(context.kind) === "theme")\n      .map((context) => textValue(context.themeId));\n    const continuityRequirement = await genericThemeContinuityRequirement(themeIds);\n    if (continuityRequirement.status === "unavailable") return themeContinuityUnavailableResponse();\n    if (continuityRequirement.status === "required") return themeContinuityRequiredResponse(continuityRequirement.themeTitle);\n    return prepareMesaContexts(contextInput);\n  }\n'''
          assert old3 in text
          text = text.replace(old3, new3, 1)
          input_anchor = '''  const input = prepareInput(payload);\n  if (!input) {\n    return NextResponse.json({\n      ok: false,\n      code: "input_invalid",\n      message: "O pedido de preparação não é válido.",\n    }, { status: 400 });\n  }\n\n'''
          assert input_anchor in text
          text = text.replace(input_anchor, input_anchor + '''  if (input.themeId) {\n    const continuityRequirement = await genericThemeContinuityRequirement([input.themeId]);\n    if (continuityRequirement.status === "unavailable") return themeContinuityUnavailableResponse();\n    if (continuityRequirement.status === "required") return themeContinuityRequiredResponse(continuityRequirement.themeTitle);\n  }\n\n''', 1)
          route.write_text(text)

          page = Path('app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/page.tsx')
          text = page.read_text()
          old = '          <MesaSelectionTray />\n'
          assert old in text
          page.write_text(text.replace(old, '''          {context.articleCount > 0 ? (\n            <p className={styles.selectionMessage} role="status">\n              Este Tema já tem artigos publicados. Para voltar à Produção, usa «Voltar a levar à Produção» em Continuidade editorial acima; os artigos existentes serão revistos antes de qualquer artigo novo.\n            </p>\n          ) : <MesaSelectionTray />}\n''', 1))

          Path('lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst route = readFileSync("app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts", "utf8");\nconst themePage = readFileSync("app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/page.tsx", "utf8");\n\ntest("Tema publicado bloqueia a preparação genérica no servidor", () => {\n  assert.match(route, /readThemeContinuity/);\n  assert.match(route, /continuity\\.publishedArticleCount > 0/);\n  assert.match(route, /code: "theme_continuity_required"/);\n  assert.match(route, /genericThemeContinuityRequirement\\(themeIds\\)/);\n  assert.match(route, /genericThemeContinuityRequirement\\(\\[input\\.themeId\\]\\)/);\n  assert.match(route, /Nenhuma Produção genérica foi criada/);\n});\n\ntest("Tema publicado deixa de expor o PREPARAR PRODUÇÃO genérico na página do Tema", () => {\n  assert.match(themePage, /context\\.articleCount > 0/);\n  assert.match(themePage, /Voltar a levar à Produção/);\n  assert.match(themePage, /artigos existentes serão revistos/);\n  assert.match(themePage, /: <MesaSelectionTray \\/>/);\n});\n''')
          PY

          rm -f .github/workflows/jornada-theme-continuity-bypass-fix.yml \
            .github/workflows/jornada-theme-continuity-bypass-fix-retry.yml \
            .github/workflows/jornada-theme-continuity-bypass-finalize.yml
          git restore next-env.d.ts 2>/dev/null || true
          git fetch origin main
          git add -A
          ACTUAL="$(git diff --cached --name-only origin/main | sort)"
          EXPECTED="$(printf '%s\n' \
            'app/admin/editorial/redacao-automatica/mesa/temas/[themeId]/page.tsx' \
            'app/api/admin/editorial/redacao-automatica/mesa/preparar/route.ts' \
            'lib/redacao-automatica/newsroom-theme-continuity-generic-bypass.test.ts' | sort)"
          printf 'STAGED NET DIFF:\n%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: enforce theme continuity after publication"
          git push origin HEAD:jornada-tema-continuity-bypass-fix-20260917
