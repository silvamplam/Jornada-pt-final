name: Temporary intent integration source
on:
  push:
    branches: [jornada-mesa-producao-intencoes-continuidade-v2-20260917]
    paths: [.github/workflows/jornada-intents-integration-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare tools only; no application or database requests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -maxdepth 1 -name '.env*' -print)"
          npm ci --ignore-scripts --include=dev
          mkdir -p /tmp/intent-tools/node/bin /tmp/intent-tools/postgres/lib
          cp "$(command -v node)" /tmp/intent-tools/node/bin/node
          tar -czf /tmp/intent-tools/node_modules.tar.gz node_modules
          docker pull postgres:17.6-bookworm
          CID=$(docker run --detach --network none --entrypoint sleep postgres:17.6-bookworm 600)
          trap 'docker rm -f "$CID" >/dev/null' EXIT
          docker cp "$CID:/usr/lib/postgresql/17" /tmp/intent-tools/postgres/17
          docker cp "$CID:/usr/share/postgresql/17" /tmp/intent-tools/postgres/share
          docker exec "$CID" bash -c 'ldd /usr/lib/postgresql/17/bin/* /usr/lib/postgresql/17/lib/*.so 2>/dev/null || true' \
            | awk '/=> \// {print $3}' | sort -u > /tmp/intent-libraries
          while read -r LIB; do docker cp -L "$CID:$LIB" "/tmp/intent-tools/postgres/lib/$(basename "$LIB")"; done < /tmp/intent-libraries
          git rev-parse HEAD > /tmp/intent-tools/source-commit.txt
          sha256sum package-lock.json > /tmp/intent-tools/package-lock.sha256
          tar -czf /tmp/intents-offline-tools.tar.gz -C /tmp intent-tools
      - name: Recover the two uncommitted drafts as data, not executable steps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/intent-drafts
          for SHA in 51423a4ce7301f1f10d69da80670b229efaedd81 17807949b40dba251ef52ea380a08fa0da68f997; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$SHA" --jq .content | base64 --decode > "/tmp/intent-drafts/$SHA"
            test "$(git hash-object "/tmp/intent-drafts/$SHA")" = "$SHA"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: intents-offline-integration-tools
          retention-days: 1
          path: |
            /tmp/intents-offline-tools.tar.gz
            /tmp/intent-drafts/
