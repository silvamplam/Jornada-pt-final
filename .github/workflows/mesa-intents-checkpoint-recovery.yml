name: Temporary intent checkpoint recovery
on:
  push:
    branches: [jornada-mesa-producao-intencoes-continuidade-v2-20260917]
    paths: [.github/workflows/mesa-intents-checkpoint-recovery.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble hash-verified source and create an unreferenced Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = silvamplam/Jornada-pt-final
          test "${GITHUB_REF}" = refs/heads/jornada-mesa-producao-intencoes-continuidade-v2-20260917
          mkdir -p /tmp/mesa-ready
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess
          from pathlib import Path
          out=Path('/tmp/mesa-ready')
          repo=os.environ['GITHUB_REPOSITORY']
          def cmd(*args,input=None):
              return subprocess.check_output(args,input=input)
          def api(path,payload=None):
              args=['gh','api',f'repos/{repo}/{path}']
              if payload is not None: args += ['--method','POST','--input','-']
              return json.loads(cmd(*args,input=None if payload is None else json.dumps(payload).encode()))
          def blob(sha):
              v=api('git/blobs/'+sha)
              b=base64.b64decode(v['content'])
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              return b
          parent=cmd('git','rev-parse','HEAD').decode().strip()
          base=cmd('git','rev-parse','HEAD^{tree}').decode().strip()
          assert not cmd('git','status','--porcelain').strip()
          prefix=lzma.LZMADecompressor().decompress(blob('fe94bbd835e932f0793cdc814822e3ad7092f295'))
          parts=prefix.split(b'diff --git ')[1:]
          assert len(parts)==9
          first=b'diff --git '+b'diff --git '.join(parts[:-1])
          compressed=blob('a4bc9394e9e02ceb315a3f5fad2d491fcd4b5c2e')+blob('27fb3e1819e45ae13b484ec551d0607ac35b7488')
          assert hashlib.sha256(compressed).hexdigest()=='cb3b99e77f2b99d0c32add68dd365a862b4789dc135f2d461d30ef4fce4536b5'
          data=json.loads(lzma.decompress(compressed))
          expected=data['expected']
          assert len(expected)==23 and len(data['new'])==5
          exact={'.ci/mesa-intents-sql/application-entry.ts','.ci/mesa-intents-sql/application.mjs',
          '.ci/mesa-intents-sql/intent-plan.fixture.json','.ci/mesa-intents-sql/offline.py',
          '.github/workflows/mesa-intents-application.yml','.github/workflows/mesa-production-intents-sql.yml',
          'app/admin/editorial/redacao-automatica/mesa/producao/[dossierId]/_workspace-client.tsx',
          'app/admin/editorial/redacao-automatica/mesa/producao/[dossierId]/page.tsx',
          'app/admin/editorial/redacao-automatica/publicacao-lote/_batchPreflightClient.tsx',
          'app/api/admin/editorial/redacao-automatica/mesa/workspace/route.ts',
          'app/api/admin/editorial/redacao-automatica/publicacao-lote/route.ts',
          'docs/mesa-production-intents-application-v1.md',
          'lib/redacao-automatica/editorial-batch-transfer.ts',
          'lib/redacao-automatica/editorial-dossier-article-plan-service.ts',
          'lib/redacao-automatica/editorial-dossier-workspace-batch-service-internal.ts',
          'lib/redacao-automatica/editorial-mesa-provenance.ts',
          'lib/redacao-automatica/editorial-source-package-internal.ts',
          'lib/redacao-automatica/editorial-source-package.ts',
          'lib/redacao-automatica/newsroom-mesa-production-intents-contract.test.ts',
          'lib/redacao-automatica/newsroom-mesa-production-intents-contract.ts',
          'lib/redacao-automatica/newsroom-mesa-production-intents-service-internal.ts',
          'lib/redacao-automatica/newsroom-mesa-production-intents-service.ts',
          'lib/redacao-automatica/newsroom-theme-continuity.test.ts'}
          assert set(expected)==exact and set(data['new'])<=exact
          for raw in [first,data['delta'].encode()]:
              paths=set(re.findall(rb'^diff --git a/(.*?) b/.*$',raw,re.M))
              assert paths and {p.decode() for p in paths}<=exact
              cmd('git','apply','--check','--index','--unidiff-zero','-',input=raw)
              cmd('git','apply','--index','--unidiff-zero','-',input=raw)
          for name,content in data['new'].items():
              p=Path(name);assert not p.exists()
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content.encode())
          actual=set(cmd('git','diff','HEAD','--name-only').decode().splitlines())|set(cmd('git','ls-files','--others','--exclude-standard').decode().splitlines())
          assert actual==exact,(actual-exact,exact-actual)
          for name,sha in expected.items():
              assert re.fullmatch('[0-9a-f]{40}',sha)
              assert cmd('git','hash-object',name).decode().strip()==sha,name
          cmd('git','add','--',*sorted(exact))
          tree=[]
          for name,sha in expected.items():
              saved=api('git/blobs',{'content':base64.b64encode(Path(name).read_bytes()).decode(),'encoding':'base64'})
              assert saved['sha']==sha,name
              tree.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          temporary='.github/workflows/mesa-intents-checkpoint-recovery.yml'
          tree.append({'path':temporary,'mode':'100644','type':'blob','sha':None})
          saved=api('git/trees',{'base_tree':base,'tree':tree})
          result={'parent':parent,'baseTree':base,'tree':saved['sha'],'files':expected,'removedTemporaryWorkflow':temporary}
          (out/'ready-tree.json').write_text(json.dumps(result,indent=2))
          local=cmd('git','write-tree').decode().strip()
          cmd('git','archive','--format=tar.gz','-o',str(out/'assembled-source.tar.gz'),local)
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-intents-ready-tree
          path: /tmp/mesa-ready
          retention-days: 7
