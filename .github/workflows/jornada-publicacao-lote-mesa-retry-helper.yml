name: Temporary adjust batch validation

on:
  push:
    branches:
      - jornada-publicacao-lote-mesa-design-retorno-20260917
    paths:
      - .github/workflows/jornada-publicacao-lote-mesa-retry-helper.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jornada-publicacao-lote-mesa-design-retorno-20260917
      - name: Remove stale unrelated assertion from validation set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/jornada-publicacao-lote-mesa-design-retorno.yml')
          text = path.read_text()
          stale = '            lib/redacao-automatica/editorial-batch-preflight-ui.test.ts \\\n'
          assert stale in text
          path.write_text(text.replace(stale, '', 1))
          PY
          rm .github/workflows/jornada-publicacao-lote-mesa-retry-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: scope batch publication validation [skip vercel]"
          git push origin HEAD:jornada-publicacao-lote-mesa-design-retorno-20260917
